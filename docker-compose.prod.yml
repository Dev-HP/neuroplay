# Produção em um único host. Coloque um proxy com HTTPS (Caddy, Traefik ou o
# balanceador do provedor) na frente da porta 80.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neuroplay
      POSTGRES_USER: neuroplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroplay -d neuroplay"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://neuroplay:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}@postgres:5432/neuroplay
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY (32+ caracteres) no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
