name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job de testes: falhas impedem a publicação.
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Executar testes
        working-directory: ./frontend
        run: npm test -- --passWithNoTests --watchAll=false
        env:
          CI: true

      - name: Lint do código (quando configurado)
        working-directory: ./frontend
        run: npm run lint --if-present

  # Job de Build
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Verificar diretório frontend
        run: |
          echo "Conteúdo da raiz:"
          ls -la
          echo "Conteúdo do frontend:"
          ls -la frontend/

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build do projeto
        working-directory: ./frontend
        run: |
          npm run build
          # GitHub Pages precisa de um shell SPA para deep links.
          cp build/index.html build/404.html
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_DEMO_MODE: true
          GENERATE_SOURCEMAP: false

      - name: Verificar build
        run: |
          echo "Verificando artefatos do build..."
          test -f frontend/build/index.html
          test -f frontend/build/404.html
          test -d frontend/build/static/js
          test -d frontend/build/static/css
          ls -la frontend/build/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

  # Job de Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
