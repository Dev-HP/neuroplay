name: Deploy do frontend (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint e testes (falhas impedem a publicação)
        run: |
          npm run lint
          npm test

      - name: Build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          # Sem API configurada, publica no modo demonstração (dados só no navegador).
          REACT_APP_DEMO_MODE: ${{ secrets.REACT_APP_API_URL == '' && 'true' || 'false' }}
        run: |
          npm run build
          # O GitHub Pages usa o 404.html para abrir rotas do React Router por link direto.
          cp build/index.html build/404.html
          test -d build/static/js
          test -d build/static/css

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
