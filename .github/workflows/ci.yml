name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, testes, build e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: ESLint (zero avisos)
        run: npm run lint

      - name: Testes (Vitest) com cobertura
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --audit-level=moderate

  backend:
    name: Backend · lint, testes e auditoria
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-test.txt pip-audit

      - name: flake8
        run: flake8 .

      - name: Testes (pytest) com cobertura
        run: pytest --cov=. --cov-report=term-missing

      - name: Auditoria de dependências
        run: pip-audit -r requirements.txt

  docker:
    name: Docker · stack completa sobe e responde
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      APP_ENV: production
      SECRET_KEY: ci-neuroplay-${{ github.run_id }}-0123456789abcdef
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql://neuroplay:ci-postgres-password@db:5432/neuroplay
    steps:
      - uses: actions/checkout@v7

      - name: Build das imagens
        run: docker compose build

      - name: Subir e verificar
        run: |
          set -euo pipefail
          docker compose up -d
          for tentativa in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then break; fi
            if [ "$tentativa" -eq 45 ]; then docker compose logs --no-color; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q healthy
          docker compose ps

      - name: Derrubar ambiente
        if: always()
        run: docker compose down --volumes --remove-orphans
